apiVersion: 1
datasources:
  - name: Zabbix
    uid: zabbix
    type: alexanderzobnin-zabbix-datasource
    access: proxy
    url: http://zabbix-web:8080/api_jsonrpc.php
    isDefault: true
    jsonData:
      # окремий користувач Zabbix лише для читання
      username: grafana
      trends: true
      trendsFrom: 7d
      cacheTTL: 30s
    secureJsonData:
      password: $__env{GRAFANA_ZBX_PASSWORD}
